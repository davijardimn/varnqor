name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  create:

permissions:
  contents: write

jobs:
  windows:
    name: Windows portable release
    if: github.event_name != 'create' || (github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release/v'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'create' && github.event.ref || github.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install Wails
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - name: Generate branded application icon
        shell: pwsh
        run: go run ./cmd/icon-gen
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            $tag = '${{ github.ref_name }}'
          } elseif ('${{ github.event_name }}' -eq 'create') {
            $releaseRef = '${{ github.event.ref }}'
            if (-not $releaseRef.StartsWith('release/v')) { throw "Unsupported release branch: $releaseRef" }
            $tag = $releaseRef.Substring('release/'.Length)
          } else {
            $versionFile = Get-Content '.\version.go' -Raw
            if ($versionFile -notmatch 'var Version = "([^"]+)"') { throw 'Unable to resolve version.go' }
            $tag = "v$($Matches[1])"
          }
          $appVersion = $tag.TrimStart('v')
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "app=$appVersion" >> $env:GITHUB_OUTPUT
      - name: Build portable Windows executable
        shell: pwsh
        run: wails build -platform windows/amd64 -o Varnqor.exe -ldflags "-X main.Version=${{ steps.version.outputs.app }}"
      - name: Verify V4 CLI surface
        shell: pwsh
        run: |
          $version = .\build\bin\Varnqor.exe version
          if ($version -notmatch '${{ steps.version.outputs.app }}') { throw "Unexpected runtime version: $version" }
          .\build\bin\Varnqor.exe help
          .\build\bin\Varnqor.exe providers --json
          .\build\bin\Varnqor.exe doctor --json
          .\build\bin\Varnqor.exe config theme dark
          .\build\bin\Varnqor.exe config language en
          .\build\bin\Varnqor.exe config optimize balanced --target 20 --horizon 120 --mode preview
          .\build\bin\Varnqor.exe config control balanced --burn 1.70 --session 62 --project 72 --budget-warning 80 --active 12 --cooling 45 --horizon 120 --minimum 1000
          $config = .\build\bin\Varnqor.exe config show --json | ConvertFrom-Json
          if ($config.version -ne 4) { throw "Expected V4 settings schema" }
          if ($config.theme -ne 'dark') { throw "Expected V2-dark theme preference" }
          if ($config.control.profile -ne 'balanced') { throw "Expected balanced control profile" }
          .\build\bin\Varnqor.exe explore --range 1h --json
          .\build\bin\Varnqor.exe pulse --range 1h --json
          .\build\bin\Varnqor.exe optimize --range 1h --json
          .\build\bin\Varnqor.exe control --range 1h --json
          $brief = .\build\bin\Varnqor.exe brief --range 1h
          if ($brief -notmatch 'Varnqor Control Brief') { throw "Control brief smoke failed" }
          .\build\bin\Varnqor.exe export --range 1h --format csv
      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $file = '.\build\bin\Varnqor.exe'
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  Varnqor.exe" | Out-File -Encoding ascii '.\build\bin\Varnqor.exe.sha256'
      - uses: actions/upload-artifact@v4
        with:
          name: varnqor-windows-amd64-${{ steps.version.outputs.tag }}
          path: |
            build/bin/Varnqor.exe
            build/bin/Varnqor.exe.sha256
          if-no-files-found: error
      - name: Create stable tag from release branch
        if: github.event_name == 'create'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG" --silent 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$env:RELEASE_TAG" -f sha="$env:GITHUB_SHA"
          }
      - name: Publish stable GitHub release
        if: github.event_name == 'create' || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view "$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:RELEASE_TAG" "build/bin/Varnqor.exe" "build/bin/Varnqor.exe.sha256" --clobber
          } else {
            gh release create "$env:RELEASE_TAG" "build/bin/Varnqor.exe" "build/bin/Varnqor.exe.sha256" --target "$env:GITHUB_SHA" --title "Varnqor $env:RELEASE_TAG" --generate-notes
          }
