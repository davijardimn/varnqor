name: Release Windows Alpha

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install Wails
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            "value=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          } else {
            "value=0.1.0-alpha.1+${{ github.run_number }}" >> $env:GITHUB_OUTPUT
          }
      - name: Build portable Windows executable
        shell: pwsh
        run: wails build -clean -platform windows/amd64 -o varnqor-windows-amd64.exe -ldflags "-X main.Version=${{ steps.version.outputs.value }}"
      - name: Verify CLI doctor
        shell: pwsh
        run: .\build\bin\varnqor-windows-amd64.exe doctor --json
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: varnqor-windows-amd64-${{ steps.version.outputs.value }}
          path: build/bin/varnqor-windows-amd64.exe
          if-no-files-found: error
      - name: Publish prerelease for tags
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" "build/bin/varnqor-windows-amd64.exe" --title "Varnqor ${{ github.ref_name }}" --generate-notes --prerelease
