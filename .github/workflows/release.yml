name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    name: Windows portable release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install Wails
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - name: Generate branded application icon
        shell: pwsh
        run: go run ./cmd/icon-gen
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            "value=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          } else {
            "value=1.0.0+${{ github.run_number }}" >> $env:GITHUB_OUTPUT
          }
      - name: Build portable Windows executable
        shell: pwsh
        run: wails build -platform windows/amd64 -o Varnqor.exe -ldflags "-X main.Version=${{ steps.version.outputs.value }}"
      - name: Verify CLI surface
        shell: pwsh
        run: |
          .\build\bin\Varnqor.exe version
          .\build\bin\Varnqor.exe help
          .\build\bin\Varnqor.exe providers --json
          .\build\bin\Varnqor.exe doctor --json
          .\build\bin\Varnqor.exe config show
      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $file = '.\build\bin\Varnqor.exe'
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  Varnqor.exe" | Out-File -Encoding ascii '.\build\bin\Varnqor.exe.sha256'
      - uses: actions/upload-artifact@v4
        with:
          name: varnqor-windows-amd64-${{ steps.version.outputs.value }}
          path: |
            build/bin/Varnqor.exe
            build/bin/Varnqor.exe.sha256
          if-no-files-found: error
      - name: Publish GitHub release for tags
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" "build/bin/Varnqor.exe" "build/bin/Varnqor.exe.sha256" --title "Varnqor ${{ github.ref_name }}" --generate-notes
