name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Go core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - name: Verify module graph
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Test core
        run: go test ./internal/...
      - name: Vet core
        run: go vet ./internal/...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify V4 desktop entrypoint
        shell: bash
        run: |
          grep -q "./AppV4" src/main.tsx
          grep -q "./v4.css" src/main.tsx
          test ! -e src/AppV3.tsx
          test ! -e src/v3.css
      - name: Install dependencies
        run: npm install
      - name: Build active V4 desktop
        run: npm run build

  desktop-windows:
    name: Windows desktop smoke build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify V4 desktop entrypoint
        shell: pwsh
        run: |
          $entry = Get-Content '.\frontend\src\main.tsx' -Raw
          if ($entry -notmatch "AppV4") { throw 'AppV4 is not the active desktop entrypoint' }
          if ($entry -notmatch "v4.css") { throw 'V4 design system is not active' }
          if (Test-Path '.\frontend\src\AppV3.tsx') { throw 'Obsolete AppV3 must not ship' }
          if (Test-Path '.\frontend\src\v3.css') { throw 'Obsolete V3 design system must not ship' }
      - name: Install Wails
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - name: Generate branded application icon
        shell: pwsh
        run: go run ./cmd/icon-gen
      - name: Build Windows desktop
        shell: pwsh
        run: wails build -platform windows/amd64 -o varnqor-ci.exe -ldflags "-X main.Version=ci-${{ github.sha }}"
      - name: Smoke V4 CLI and settings
        shell: pwsh
        run: |
          $exe = (Resolve-Path '.\build\bin\varnqor-ci.exe').Path
          function Invoke-Varnqor {
            param(
              [string[]]$CommandArgs,
              [string]$StdoutPath = ''
            )
            if ($StdoutPath) {
              $process = Start-Process -FilePath $exe -ArgumentList $CommandArgs -Wait -PassThru -RedirectStandardOutput $StdoutPath
            } else {
              $process = Start-Process -FilePath $exe -ArgumentList $CommandArgs -Wait -PassThru -NoNewWindow
            }
            if ($process.ExitCode -ne 0) {
              throw "Varnqor command failed ($($process.ExitCode)): $($CommandArgs -join ' ')"
            }
          }

          Invoke-Varnqor -CommandArgs @('version')
          Invoke-Varnqor -CommandArgs @('help')
          Invoke-Varnqor -CommandArgs @('providers','--json')
          Invoke-Varnqor -CommandArgs @('doctor','--json')

          Invoke-Varnqor -CommandArgs @('config','theme','dark')
          Invoke-Varnqor -CommandArgs @('config','language','pt-BR')
          Invoke-Varnqor -CommandArgs @('config','optimize','economy','--target','25','--horizon','360','--mode','preview')
          Invoke-Varnqor -CommandArgs @('config','control','economy','--burn','1.50','--session','58','--project','68','--budget-warning','75','--active','10','--cooling','40','--horizon','120','--minimum','800')

          $configPath = Join-Path $env:APPDATA 'varnqor\settings.json'
          if (-not (Test-Path $configPath)) { throw "Settings file was not persisted: $configPath" }
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          if ($config.version -ne 4) { throw "Expected settings schema v4" }
          if ($config.theme -ne 'dark') { throw "Theme did not persist" }
          if ($config.language -ne 'pt-BR') { throw "Language did not persist" }
          if ($config.optimization.goal -ne 'economy') { throw "Optimize goal did not persist" }
          if ($config.control.profile -ne 'economy') { throw "Control profile did not persist" }
          if ([math]::Abs($config.control.burnCeilingRatio - 1.50) -gt 0.001) { throw "Control burn ceiling did not persist" }

          Invoke-Varnqor -CommandArgs @('explore','--range','1h','--json')
          Invoke-Varnqor -CommandArgs @('pulse','--range','1h','--json')
          Invoke-Varnqor -CommandArgs @('optimize','--range','1h','--json')
          Invoke-Varnqor -CommandArgs @('control','--range','1h','--json')

          $briefPath = Join-Path $env:RUNNER_TEMP 'varnqor-control-brief.txt'
          Invoke-Varnqor -CommandArgs @('brief','--range','1h') -StdoutPath $briefPath
          $brief = Get-Content $briefPath -Raw
          if ($brief -notmatch 'Varnqor Control Brief') { throw "Control brief smoke failed" }

          Invoke-Varnqor -CommandArgs @('export','--range','1h','--format','csv')
      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $file = '.\build\bin\varnqor-ci.exe'
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  varnqor-ci.exe" | Out-File -Encoding ascii '.\build\bin\varnqor-ci.exe.sha256'
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: varnqor-windows-amd64-${{ github.sha }}
          path: |
            build/bin/varnqor-ci.exe
            build/bin/varnqor-ci.exe.sha256
          if-no-files-found: error
          retention-days: 7
