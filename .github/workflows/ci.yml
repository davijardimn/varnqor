name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Go core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - name: Verify module graph
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Test core
        run: go test ./internal/...
      - name: Vet core
        run: go vet ./internal/...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build

  desktop-windows:
    name: Windows desktop smoke build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install Wails
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - name: Build Windows desktop
        shell: pwsh
        run: wails build -platform windows/amd64 -o varnqor-ci.exe -ldflags "-X main.Version=ci-${{ github.sha }}"
      - name: Smoke CLI
        shell: pwsh
        run: |
          .\build\bin\varnqor-ci.exe version
          .\build\bin\varnqor-ci.exe help
          .\build\bin\varnqor-ci.exe config show
      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $file = '.\build\bin\varnqor-ci.exe'
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  varnqor-ci.exe" | Out-File -Encoding ascii '.\build\bin\varnqor-ci.exe.sha256'
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: varnqor-windows-amd64-${{ github.sha }}
          path: |
            build/bin/varnqor-ci.exe
            build/bin/varnqor-ci.exe.sha256
          if-no-files-found: error
          retention-days: 7
