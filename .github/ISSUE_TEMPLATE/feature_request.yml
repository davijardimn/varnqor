name: Feature request
description: Propose a resource-intelligence capability.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What resource/agent problem should Varnqor help explain or prevent?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: Does this require Varnqor to change agent behavior?
      options: [No - observation/advice only, Yes - explicit user-approved action, Unsure]
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy considerations
      description: What data would be required, stored, or transmitted?
